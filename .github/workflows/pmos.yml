name: pmos-sirius

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv git curl ca-certificates \
            btrfs-progs dosfstools e2fsprogs device-tree-compiler

      - name: Install pmbootstrap from source
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git pmb-src
          python3 -m venv "$HOME/venv"
          . "$HOME/venv/bin/activate"
          pip install --upgrade pip
          pip install ./pmb-src
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports
        run: git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git pmaports-upstream

      - name: Drop in our aports
        run: |
          cp -r pmaports/device-xiaomi-sirius            pmaports-upstream/device/testing/
          cp -r pmaports/linux-postmarketos-qcom-sdm710  pmaports-upstream/device/testing/
          ls pmaports-upstream/device/testing/ | grep -E 'sirius|sdm710'

      - name: Write pmbootstrap config + seed work dir
        run: |
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$HOME/.config" "$WORK"
          printf '[pmbootstrap]\naports = %s\ndevice = xiaomi-sirius\nui = none\nuser = user\nwork = %s\n' \
            "$PWD/pmaports-upstream" "$WORK" > "$HOME/.config/pmbootstrap_v3.cfg"
          echo 8 > "$WORK/version"
          echo 8 > "$WORK/.version"
          pmbootstrap config aports
          pmbootstrap config device

      - name: Compute package checksums
        run: pmbootstrap checksum linux-postmarketos-qcom-sdm710

      - name: Build kernel package (dump log on failure)
        run: |
          if ! pmbootstrap build --arch aarch64 linux-postmarketos-qcom-sdm710; then
            echo "=========== pmbootstrap log.txt (tail 200) ==========="
            tail -n 200 "$HOME/.local/var/pmbootstrap/log.txt" 2>/dev/null || true
            exit 1
          fi

      - name: Build device package
        run: pmbootstrap build --arch aarch64 device-xiaomi-sirius

      - name: Build the rootfs image
        run: pmbootstrap install --no-sshd --password 147147

      - name: Export artifacts
        run: |
          pmbootstrap export || true
          mkdir -p out
          cp -v "$HOME/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/"*.img out/ 2>/dev/null || true
          find "$HOME/.local/var/pmbootstrap" -name 'boot.img' -exec cp -v {} out/ \; 2>/dev/null || true
          ls -lR out

      - uses: actions/upload-artifact@v4
        with:
          name: pmos-sirius-artifacts
          path: out/
          if-no-files-found: warn
