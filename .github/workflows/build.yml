name: build-sirius

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "sdm670-mainline/linux branch or tag"
        required: false
        default: "on-stable"
      mode:
        description: "full = kernel+dtb; pack = reuse cached kernel and dtb; dtb = reuse cached kernel, rebuild dtb only"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - pack
          - dtb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (gcc cross toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 cpio gzip xz-utils file bzip2 ccache \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1
          ccache --version | head -1
          mkdir -p ~/.cache/sirius-busybox ~/.ccache

      # ---- caches ---------------------------------------------------------
      # ccache makes an unchanged kernel rebuild cheap; the kernel image cache
      # lets the "pack" mode skip the kernel entirely (~2 min instead of ~18).
      - name: Cache ccache
        if: github.event.inputs.mode != 'pack'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.kernel_ref }}-${{ hashFiles('config/sirius.config', 'dts/sdm710-xiaomi-sirius.dts') }}
          restore-keys: |
            ccache-${{ github.event.inputs.kernel_ref }}-
            ccache-

      # The kernel image does not depend on the device tree, so the device tree
      # is deliberately NOT part of this key: a DTS-only change then still hits
      # the cached Image.gz and only the dtb has to be rebuilt (mode=dtb).
      - name: Restore built kernel image
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: carry
          key: kernel-${{ github.event.inputs.kernel_ref }}-${{ hashFiles('config/sirius.config') }}

      - name: Restore arm64 busybox
        uses: actions/cache@v4
        with:
          path: ~/.cache/sirius-busybox
          key: busybox-arm64-${{ hashFiles('initramfs/build-initramfs.sh') }}

      # ---- kernel ---------------------------------------------------------
      - name: Build kernel image + dtbs
        if: github.event.inputs.mode == 'full' && steps.kcache.outputs.cache-hit != 'true'
        env:
          ARCH: arm64
          CROSS_COMPILE: "ccache aarch64-linux-gnu-"
          CCACHE_DIR: "/home/runner/.ccache"
          CCACHE_MAXSIZE: "2G"
        run: |
          ccache --zero-stats
          git clone --depth=1 -b "${{ github.event.inputs.kernel_ref }}" https://gitlab.com/sdm670-mainline/linux.git kernel
          cp dts/sdm710-xiaomi-sirius.dts kernel/arch/arm64/boot/dts/qcom/
          MF=kernel/arch/arm64/boot/dts/qcom/Makefile
          grep -q 'sdm710-xiaomi-sirius.dtb' "$MF" || \
            printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= sdm710-xiaomi-sirius.dtb\n' >> "$MF"
          cd kernel
          make defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sdm670.config
          scripts/kconfig/merge_config.sh -m .config ../config/sirius.config
          make olddefconfig
          make -j"$(nproc)" Image.gz dtbs
          ls -l arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sdm710-xiaomi-sirius.dtb
          ccache --show-stats
          mkdir -p ../carry
          cp arch/arm64/boot/Image.gz ../carry/
          cp arch/arm64/boot/dts/qcom/sdm710-xiaomi-sirius.dtb ../carry/

      - name: Save built kernel image
        if: github.event.inputs.mode == 'full' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: carry
          key: kernel-${{ github.event.inputs.kernel_ref }}-${{ hashFiles('config/sirius.config') }}

      - name: Rebuild device tree only
        if: github.event.inputs.mode == 'dtb'
        env:
          ARCH: arm64
          CROSS_COMPILE: "ccache aarch64-linux-gnu-"
          CCACHE_DIR: "/home/runner/.ccache"
          CCACHE_MAXSIZE: "2G"
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_ref }}" https://gitlab.com/sdm670-mainline/linux.git kernel
          cp dts/sdm710-xiaomi-sirius.dts kernel/arch/arm64/boot/dts/qcom/
          MF=kernel/arch/arm64/boot/dts/qcom/Makefile
          grep -q 'sdm710-xiaomi-sirius.dtb' "$MF" || \
            printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= sdm710-xiaomi-sirius.dtb\n' >> "$MF"
          cd kernel
          make defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sdm670.config
          scripts/kconfig/merge_config.sh -m .config ../config/sirius.config
          make olddefconfig
          make -j"$(nproc)" dtbs
          cp arch/arm64/boot/dts/qcom/sdm710-xiaomi-sirius.dtb ../carry/
          ls -l ../carry/

      - name: Stage kernel image into the tree layout
        run: |
          [ -f carry/Image.gz ] || { echo "::error::no built kernel image available; run once with mode=full"; exit 1; }
          mkdir -p kernel/arch/arm64/boot/dts/qcom
          cp -v carry/Image.gz kernel/arch/arm64/boot/Image.gz
          cp -v carry/sdm710-xiaomi-sirius.dtb kernel/arch/arm64/boot/dts/qcom/

      # ---- initramfs + boot image ----------------------------------------
      - name: Build initramfs and boot.img
        run: |
          bash initramfs/build-initramfs.sh
          bash scripts/mkbootimg.sh

      - name: Verify initramfs is AArch64
        run: |
          mkdir -p /tmp/ird
          ( cd /tmp/ird && gzip -dc "$GITHUB_WORKSPACE/out/initramfs.cpio.gz" | cpio -idm --quiet )
          ls -l /tmp/ird/init /tmp/ird/bin/busybox
          EM=$(od -An -tx1 -j18 -N2 /tmp/ird/bin/busybox | tr -d ' \n')
          CL=$(od -An -tx1 -j4  -N1 /tmp/ird/bin/busybox | tr -d ' \n')
          echo "busybox elfclass=$CL e_machine=$EM"
          [ "$CL" = "02" ] && [ "$EM" = "b700" ] || {
            echo "::error::initramfs busybox is not a 64-bit AArch64 binary"; exit 1; }
          head -1 /tmp/ird/init

      - uses: actions/upload-artifact@v4
        with:
          name: sirius-boot
          path: |
            out/boot.img
            out/Image.gz
            out/sdm710-xiaomi-sirius.dtb
            out/initramfs.cpio.gz
          if-no-files-found: error
