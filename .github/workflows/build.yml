name: build-sirius

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "sdm670-mainline/linux branch or tag"
        required: false
        default: "on-stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (gcc cross toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 cpio gzip xz-utils file bzip2 \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone the sdm670-mainline kernel
        run: |
          REF="${{ github.event.inputs.kernel_ref }}"
          [ -z "$REF" ] && REF="on-stable"
          git clone --depth=1 -b "$REF" https://gitlab.com/sdm670-mainline/linux.git kernel
          cd kernel && git log --oneline -1

      - name: Install sirius device tree
        run: |
          cp dts/sdm710-xiaomi-sirius.dts kernel/arch/arm64/boot/dts/qcom/
          MF=kernel/arch/arm64/boot/dts/qcom/Makefile
          grep -q 'sdm710-xiaomi-sirius.dtb' "$MF" || \
            printf 'dtb-$(CONFIG_ARCH_QCOM)\t+= sdm710-xiaomi-sirius.dtb\n' >> "$MF"

      - name: Configure kernel
        env: { ARCH: arm64, CROSS_COMPILE: "aarch64-linux-gnu-" }
        run: |
          cd kernel
          make defconfig
          scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sdm670.config
          scripts/kconfig/merge_config.sh -m .config ../config/sirius.config
          make olddefconfig

      - name: Build kernel image + dtbs
        env: { ARCH: arm64, CROSS_COMPILE: "aarch64-linux-gnu-" }
        run: |
          cd kernel
          make -j"$(nproc)" Image.gz dtbs
          ls -l arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sdm710-xiaomi-sirius.dtb

      - name: Build initramfs and boot.img
        run: |
          bash initramfs/build-initramfs.sh
          bash scripts/mkbootimg.sh

      - name: Verify initramfs is AArch64
        run: |
          mkdir -p /tmp/ird
          ( cd /tmp/ird && gzip -dc "$GITHUB_WORKSPACE/out/initramfs.cpio.gz" | cpio -idm --quiet )
          ls -l /tmp/ird/init /tmp/ird/bin/busybox
          EM=$(od -An -tx1 -j18 -N2 /tmp/ird/bin/busybox | tr -d ' \n')
          CL=$(od -An -tx1 -j4  -N1 /tmp/ird/bin/busybox | tr -d ' \n')
          echo "busybox elfclass=$CL e_machine=$EM"
          [ "$CL" = "02" ] && [ "$EM" = "b700" ] || {
            echo "::error::initramfs busybox is not a 64-bit AArch64 binary"; exit 1; }
          head -1 /tmp/ird/init

      - uses: actions/upload-artifact@v4
        with:
          name: sirius-boot
          path: |
            out/boot.img
            out/Image.gz
            out/sdm710-xiaomi-sirius.dtb
            out/initramfs.cpio.gz
          if-no-files-found: error
